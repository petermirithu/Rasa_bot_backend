<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzz bot</title>
    <style>
        .main {
            text-align: center;
            width: "200px";
        }

        .marq {
            padding-top: 30px;
            padding-bottom: 30px;
        }
    </style>
</head>

<body bgcolor="#F5EFE6">
    <h1 style="text-align: center;color:#3C2317">Buzz Bot</h1>


    <div class="main">
        <marquee class="marq" direction="right" behavior=alternate loop="">
            <h3 style="color:#98A8F8">Backend Server</h3>
        </marquee>
        <marquee class="marq" behavior=alternate direction="left" loop="">
            <p style="color:#628E90;font-style: italic;">Server is up and running</p>
        </marquee>
    </div>
</body>

</html>
